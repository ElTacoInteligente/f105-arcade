const MOVES={"fanboys": {"name": "FANBOYS", "rule": "Joins two full sentences. Comma BEFORE the joining word.", "joiners": ["for", "and", "nor", "but", "or", "yet", "so"]}, "clue": {"name": "Clue word first", "rule": "Start with the clue word. Comma AFTER the clue part.", "joiners": ["when", "while", "after", "before", "until", "because", "since", "although", "if", "unless"]}, "tuck": {"name": "Tuck in who / which / that", "rule": "An extra fact with who or which gets commas. That takes no commas.", "joiners": ["who", "which", "that"]}, "rename": {"name": "Rename it", "rule": "No joining word. Commas AROUND the new name.", "joiners": []}};
function kBuild(it,move,j){
  const key=move+'|'+(move==='rename'?'-':j);
  if(it.t[key])return it.t[key];
  if(move==='fanboys')return it.a_up+'^ '+j+' '+it.b_low+'.';
  if(move==='clue')return j.charAt(0).toUpperCase()+j.slice(1)+' '+it.a_low+'^ '+it.b_low+'.';
  if(move==='tuck')return it.a_up+'^ '+j+' '+it.b_low+'.';
  return it.a_up+'^ '+it.b_low+'.';
}

      c.onclick=()=>{if(api.locked())return;move=m;j=null;drawMoves();drawJ();drawPrev();api.changed()};mRow.append(c)});
    rule.innerHTML=move?'<b>'+MOVES[move].name+':</b> '+MOVES[move].rule:'';}

  function drawPrev(){prev.innerHTML='';on=new Set();want=new Set();gaps=[];
