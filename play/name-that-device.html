  color:var(--ink);font-family:Fredoka,"Avenir Next","Segoe UI",Roboto,Arial,sans-serif;font-size:19px;line-height:1.45}

.opt.sel{border-color:var(--navy);background:#eef2fb}.opt.sel .l{background:var(--navy);color:#fff}

.btn{background:var(--navy);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px 26px;font-weight:700;font-size:19px;letter-spacing:.3px;position:relative;overflow:hidden;min-width:150px;box-shadow:4px 4px 0 var(--ink);transition:transform .06s,box-shadow .06s}

.link{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:15px}

.subtitle{color:#dfe6f5;font-size:19px;margin:6px 0 18px}

.map{display:grid;gap:10px;margin-top:14px}

.lvl .t{font-weight:700;font-size:20px}.lvl .d{font-size:15px;color:var(--muted)}

.review .def{font-size:20px;font-weight:700}
.review .eg{background:var(--cream);border-left:6px solid var(--accent);border-radius:10px;padding:10px 14px;margin:10px 0;font-family:Georgia,serif;font-size:19px}
