const RENDERERS={dial:function(item,api){
  const {el,shuffle}=Arcade;const sels=[];
  const box=el('div',{class:'dial'});
  const parts=item.template.split(/(\{\d\})/);
  parts.forEach(p=>{const m=p.match(/^\{(\d)\}$/);
    if(!m){box.append(p);return}
    const slot=item.slots[+m[1]];
    const s=el('select',{},el('option',{value:'',text:'▾ turn the dial'}),...shuffle(slot).map(o=>el('option',{value:o.w,text:o.w})));
    s.onchange=()=>api.changed();s._slot=slot;sels.push(s);box.append(s)});
  const meter=el('div',{class:'meter'},el('i'));const mlab=el('div',{class:'muted',style:'font-weight:800'});
  const out=el('div',{style:'display:none;margin-top:10px'},el('div',{class:'stepl',text:'Tone meter: '+item.target.toUpperCase()}),meter,mlab);
  const tone=s=>(s._slot.find(o=>o.w===s.value)||{}).tone;
  return {node:el('div',{},box,out),ready:()=>sels.every(s=>s.value),
    check:()=>sels.every(s=>tone(s)===item.target),
    reveal:()=>{const hit=sels.filter(s=>tone(s)===item.target).length;out.style.display='block';
      requestAnimationFrame(()=>{meter.firstChild.style.width=Math.round(100*hit/sels.length)+'%'});
      mlab.textContent=hit+' of '+sels.length+' dials point to '+item.target+'.';
      sels.forEach(s=>{const ok=tone(s)===item.target;s.classList.add(ok?'right':'wrong');
        if(!ok){const w=s._slot.find(o=>o.tone===item.target).w;s.insertAdjacentElement('afterend',el('b',{style:'color:#1f8a4c;font-family:Avenir Next,Arial;font-size:16px',text:' → '+w+' '}))}})},
    lock:()=>sels.forEach(s=>s.disabled=true),
    speakText:()=>item.template.replace(/\{\d\}/g,'blank')};
}};

cfg.renderers=(typeof RENDERERS!=='undefined')?RENDERERS:{};Arcade.Game(cfg)})();</script></body></html>
